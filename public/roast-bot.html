<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RoastBot — BGSB Coffee Expert</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --void:     #0E0B09;
    --ground:   #1A1410;
    --elevated: #241C16;
    --rim:      #2E241C;
    --crema:    #C8A96E;
    --bone:     #E8DDD0;
    --ash:      #8A7A6A;
    --muted:    #4A3C30;
    --copper:   #B87333;
    --ember:    #C0392B;
  }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--bone);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 720px;
    margin: 0 auto;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--rim);
    background: var(--ground);
    flex-shrink: 0;
  }
  .header-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--elevated);
    border: 1px solid var(--rim);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header-text h1 {
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.8px; color: var(--bone);
  }
  .header-text p {
    font-size: 11px; color: var(--ash); margin-top: 1px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #27ae60; margin-left: auto; flex-shrink: 0;
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--rim); border-radius: 2px; }

  /* Empty state */
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 32px 20px;
  }
  #empty .icon { font-size: 40px; opacity: 0.4; }
  #empty h2 { font-size: 18px; font-weight: 700; color: var(--bone); }
  #empty p { font-size: 13px; color: var(--ash); text-align: center; max-width: 280px; }
  .starters { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; margin-top: 16px; }
  .starter {
    background: var(--elevated);
    border: 1px solid var(--rim);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--ash);
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, color 0.15s;
  }
  .starter:hover { border-color: var(--crema); color: var(--bone); }

  /* Bubbles */
  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--elevated); border: 1px solid var(--rim);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.bot {
    background: var(--elevated);
    border: 1px solid var(--rim);
    border-bottom-left-radius: 4px;
    color: var(--bone);
  }
  .bubble.user {
    background: var(--crema);
    border-bottom-right-radius: 4px;
    color: var(--void);
    font-weight: 500;
  }
  .bubble.error { border-color: var(--ember); opacity: 0.8; }

  /* Typing indicator */
  .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ash);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* Input bar */
  #input-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--rim);
    background: var(--ground);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: var(--elevated);
    border: 1px solid var(--rim);
    border-radius: 14px;
    color: var(--bone);
    font-size: 15px;
    padding: 11px 16px;
    resize: none;
    max-height: 100px;
    outline: none;
    font-family: inherit;
    line-height: 1.4;
    transition: border-color 0.15s;
  }
  #input::placeholder { color: var(--muted); }
  #input:focus { border-color: var(--crema); }
  #send {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--crema);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: opacity 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  #send:disabled { background: var(--elevated); cursor: default; opacity: 0.5; }

  /* Limit warning */
  #limit-msg {
    display: none;
    text-align: center;
    padding: 12px 20px;
    font-size: 13px;
    color: var(--ash);
    border-top: 1px solid var(--rim);
    background: var(--ground);
  }
  #limit-msg a { color: var(--crema); text-decoration: none; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="header-icon">☕</div>
    <div class="header-text">
      <h1>ROASTBOT</h1>
      <p>BGSB Coffee Roasting Expert</p>
    </div>
    <div class="status-dot" title="Online"></div>
  </header>

  <div id="messages">
    <div id="empty">
      <div class="icon">☕</div>
      <h2>Ask anything about roasting</h2>
      <p>Powered by BGSB's coffee knowledge base</p>
      <div class="starters">
        <button class="starter" onclick="send('What temperature does first crack happen?')">What temperature does first crack happen?</button>
        <button class="starter" onclick="send('How do I improve my development time ratio?')">How do I improve my development time ratio?</button>
        <button class="starter" onclick="send('What are Category 1 defects in green beans?')">What are Category 1 defects in green beans?</button>
        <button class="starter" onclick="send('Tips for a medium-dark roast at home?')">Tips for a medium-dark roast at home?</button>
      </div>
    </div>
  </div>

  <div id="input-bar">
    <textarea id="input" placeholder="Ask about roasting…" rows="1" maxlength="600"></textarea>
    <button id="send" onclick="send()" disabled>➤</button>
  </div>
  <div id="limit-msg">
    You've reached the 20-message limit for this session.
    <a href="https://roastcoffee.ai" target="_blank">Visit our site</a> to learn more.
  </div>

</div>

<script>
  const API = '/api/webchat';
  const MAX_MESSAGES = 20;

  const messagesEl = document.getElementById('messages');
  const emptyEl    = document.getElementById('empty');
  const inputEl    = document.getElementById('input');
  const sendBtn    = document.getElementById('send');
  const limitMsg   = document.getElementById('limit-msg');

  let history = [];
  let msgCount = parseInt(sessionStorage.getItem('bgsb_msg_count') || '0');
  let loading  = false;
  let lastSent = 0;

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    sendBtn.disabled = !inputEl.value.trim() || loading || msgCount >= MAX_MESSAGES;
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  if (msgCount >= MAX_MESSAGES) showLimitReached();

  function showLimitReached() {
    inputEl.disabled = true;
    sendBtn.disabled = true;
    document.getElementById('input-bar').style.display = 'none';
    limitMsg.style.display = 'block';
  }

  function appendMessage(role, text, error = false) {
    if (emptyEl) emptyEl.style.display = 'none';

    const row = document.createElement('div');
    row.className = `row ${role}`;

    if (role === 'bot') {
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = '☕';
      row.appendChild(av);
    }

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}${error ? ' error' : ''}`;
    bubble.textContent = text;
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    if (emptyEl) emptyEl.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typing-row';

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = '☕';
    row.appendChild(av);

    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    document.getElementById('typing-row')?.remove();
  }

  async function send(text) {
    const msg = (text || inputEl.value).trim();
    if (!msg || loading || msgCount >= MAX_MESSAGES) return;

    const now = Date.now();
    if (now - lastSent < 2000) return;
    lastSent = now;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    loading = true;

    appendMessage('user', msg);
    showTyping();

    msgCount++;
    sessionStorage.setItem('bgsb_msg_count', msgCount);

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, history }),
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok || data.error) {
        appendMessage('bot', 'Sorry, something went wrong. Please try again in a moment.', true);
      } else {
        appendMessage('bot', data.text);
        history.push({ role: 'user', text: msg });
        history.push({ role: 'assistant', text: data.text });
        if (history.length > 12) history = history.slice(-12);
      }
    } catch {
      removeTyping();
      appendMessage('bot', 'Connection error. Please check your internet and try again.', true);
    }

    loading = false;
    if (msgCount >= MAX_MESSAGES) {
      showLimitReached();
    } else {
      sendBtn.disabled = !inputEl.value.trim();
    }
  }
</script>
</body>
</html>
